<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>静岡城北店 クーポンルーレット</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;background:#f7f7f7;color:#222}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px;text-align:center}
h1{font-size:25px;margin:8px 0 6px}
.sub{font-size:14px;color:#666;margin-bottom:18px}
.wheelbox{position:relative;width:min(88vw,360px);aspect-ratio:1;margin:0 auto 22px}
#wheel{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 5px 18px #0002;transition:transform 4.5s cubic-bezier(.12,.8,.15,1)}
.pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #222}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#fff;border:5px solid #222;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;z-index:1}
button{border:0;border-radius:999px;padding:15px 48px;font-size:18px;font-weight:700;background:#222;color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.result{display:none;background:#fff;border-radius:16px;padding:20px;margin-top:20px;box-shadow:0 4px 14px #0001}
.result h2{margin:0 0 8px;font-size:23px}
.result p{margin:7px 0;color:#555}
.code{display:inline-block;background:#f1f1f1;border:1px dashed #999;border-radius:8px;padding:10px 18px;margin:10px 0;font-size:20px;font-weight:700;letter-spacing:1px}
.note{font-size:12px;color:#777;line-height:1.7;margin-top:16px}
.used{display:none;background:#fff;border-radius:16px;padding:28px 20px;margin-top:20px;box-shadow:0 4px 14px #0001}
.used h2{margin:0 0 12px;font-size:22px}
.used p{margin:0;color:#555;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎁 静岡城北店<br>クーポンルーレット</h1>
  <div class="sub">ボタンを押して、今日のクーポンをGET！</div>

  <div class="wheelbox">
    <div class="pointer"></div>
    <div class="center">START</div>
    <canvas id="wheel" width="800" height="800"></canvas>
  </div>

  <button id="spin">ルーレットを回す</button>

  <div class="result" id="result">
    <h2 id="resultTitle"></h2>
    <p>おめでとうございます！</p>
    <div class="code" id="coupon"></div>
    <p id="detail"></p>
    <div class="note">※ご利用条件・有効期限は店舗の設定に合わせて変更してください。<br>※この画面はサンプルです。</div>
  </div>

  <div class="used" id="used">
    <h2>このクーポンは利用済みです</h2>
    <p>この端末では、ルーレットをもう一度回すことはできません。</p>
  </div>
</div>

<script>
const items = [
  {name:"500円OFF", code:"JY-500", detail:"お会計から500円OFF"},
  {name:"1,000円OFF", code:"JY-1000", detail:"お会計から1,000円OFF"},
  {name:"1,500円OFF", code:"JY-1500", detail:"お会計から1,500円OFF"},
  {name:"2,000円OFF", code:"JY-2000", detail:"お会計から2,000円OFF"},
  {name:"300円OFF", code:"JY-300", detail:"お会計から300円OFF"},
  {name:"1,000円OFF", code:"JY-1000-B", detail:"お会計から1,000円OFF"},
  {name:"500円OFF", code:"JY-500-B", detail:"お会計から500円OFF"},
  {name:"2,000円OFF", code:"JY-2000-B", detail:"お会計から2,000円OFF"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const colors=["#f7c9c9","#f8dfb5","#cde5d0","#cbdcf3","#ead2ef","#f3e4b7","#d0e8e8","#e5d4c8"];
const n=items.length, cx=400, cy=400, r=380;

function draw(){
  ctx.clearRect(0,0,800,800);
  for(let i=0;i<n;i++){
    const a0=i*2*Math.PI/n-Math.PI/2, a1=(i+1)*2*Math.PI/n-Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=6;ctx.stroke();
    const a=(a0+a1)/2;
    ctx.save();ctx.translate(cx+Math.cos(a)*255,cy+Math.sin(a)*255);
    ctx.rotate(a+Math.PI/2);
    ctx.fillStyle="#222";ctx.font="bold 34px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(items[i].name,0,0);ctx.restore();
  }
}
draw();

const USED_KEY="shizuoka_johoku_roulette_used_v1";
let rotation=0, spinning=false;

// すでに利用済みなら、ルーレットを表示せず利用済み画面にします。
if(localStorage.getItem(USED_KEY)==="1"){
  document.getElementById("wheel").style.display="none";
  document.querySelector(".pointer").style.display="none";
  document.querySelector(".center").style.display="none";
  document.getElementById("spin").style.display="none";
  document.getElementById("used").style.display="block";
}

document.getElementById("spin").addEventListener("click",()=>{
  if(spinning || localStorage.getItem(USED_KEY)==="1")return;

  // 回し始めた時点で利用済みにします。途中でページを閉じても再抽選できません。
  localStorage.setItem(USED_KEY,"1");
  spinning=true;
  document.getElementById("spin").disabled=true;
  const index=Math.floor(Math.random()*n);
  const segment=360/n;
  const target=360*6 + (360-(index+0.5)*segment);
  rotation += target;
  canvas.style.transform=`rotate(${rotation}deg)`;

  setTimeout(()=>{
    document.getElementById("resultTitle").textContent=items[index].name;
    document.getElementById("coupon").textContent=items[index].code;
    document.getElementById("detail").textContent=items[index].detail;
    document.getElementById("result").style.display="block";
    spinning=false;
  },4600);
});
</script>
</body>
</html>
