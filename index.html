
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>静岡城北店 クーポンルーレット</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"M PLUS Rounded 1c",sans-serif;
  font-weight:800;
  background:#fff8f0;
  color:#333;
}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:24px 16px 40px;
  text-align:center;
}

h1{
  font-size:26px;
  font-weight:900;
  line-height:1.5;
  margin:8px 0 6px;
  color:#e85b45;
}

.sub{
  font-size:14px;
  font-weight:800;
  color:#777;
  margin-bottom:18px;
}

.wheelbox{
  position:relative;
  width:min(88vw,360px);
  aspect-ratio:1;
  margin:0 auto 22px;
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:8px solid #fff;
  box-shadow:0 5px 18px #0002;
  transition:transform 8s cubic-bezier(.12,.8,.15,1);
}

.pointer{
  position:absolute;
  top:-3px;
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  width:0;
  height:0;
  border-left:17px solid transparent;
  border-right:17px solid transparent;
  border-top:34px solid #e85b45;
}

.center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:62px;
  height:62px;
  border-radius:50%;
  background:#fff;
  border:5px solid #e85b45;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;
  z-index:1;
  color:#e85b45;
}

button{
  border:0;
  border-radius:999px;
  padding:16px 35px;
  font-family:inherit;
  font-size:18px;
  font-weight:900;
  background:#ff704f;
  color:#fff;
  cursor:pointer;
  box-shadow:0 5px 0 #d94d35;
}

button:disabled{
  opacity:.5;
  cursor:default;
}

.result{
  display:none;
  background:#fff;
  border:3px solid #ffcf9c;
  border-radius:20px;
  padding:22px 20px;
  margin-top:20px;
  box-shadow:0 4px 14px #0001;
}

.result h2{
  margin:0 0 8px;
  font-size:29px;
  font-weight:900;
  color:#ed6247;
}

.result p{
  margin:7px 0;
  color:#555;
  font-weight:800;
}

.code{
  display:inline-block;
  background:#fff2df;
  border:2px dashed #ff9c55;
  border-radius:12px;
  padding:12px 20px;
  margin:10px 0;
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
  color:#e85b45;
}

.use-button{
  display:block;
  width:100%;
  margin:18px auto 5px;
  background:#e85b45;
  box-shadow:0 5px 0 #bd4030;
}

.note{
  font-size:12px;
  font-weight:700;
  color:#888;
  line-height:1.8;
  margin-top:16px;
}

.used{
  display:none;
  background:#fff;
  border:3px solid #9ac9a2;
  border-radius:20px;
  padding:28px 20px;
  margin-top:20px;
  box-shadow:0 4px 14px #0001;
}

.used h2{
  margin:0 0 12px;
  font-size:25px;
  font-weight:900;
  color:#43965a;
}

.used .used-price{
  font-size:29px;
  font-weight:900;
  color:#43965a;
  margin:10px 0;
}

.used p{
  margin:0;
  color:#555;
  line-height:1.8;
  font-weight:700;
}
</style>
</head>

<body>
<div class="wrap">

  <h1>🎁 静岡城北店<br>クーポンルーレット</h1>

  <div class="sub">
    ボタンを押して、今日のクーポンをGET！
  </div>

  <div class="wheelbox">
    <div class="pointer"></div>
    <div class="center">START</div>
    <canvas id="wheel" width="800" height="800"></canvas>
  </div>

  <button id="spin">ルーレットを回す</button>

  <div class="result" id="result">
    <h2 id="resultTitle"></h2>
    <p>おめでとうございます！</p>

    <div class="code" id="coupon"></div>
    <p id="detail"></p>

    <button class="use-button" id="useCoupon">
      クーポンを使用する
    </button>

    <div class="note">
      ※11月中の作業が対象です。<br>
      ※他の割引との併用はできません。<br>
      ※クーポン使用時にスタッフへ画面をご提示ください。
    </div>
  </div>

  <div class="used" id="used">
    <h2>✓ 使用済み</h2>
    <div class="used-price" id="usedPrice"></div>
    <p>こちらのクーポンは使用済みです。<br>ご利用ありがとうございました！</p>
  </div>

</div>

<script>
const items = [
  {name:"500円OFF", code:"JY-500", detail:"お会計から500円OFF"},
  {name:"1,000円OFF", code:"JY-1000", detail:"お会計から1,000円OFF"},
  {name:"1,500円OFF", code:"JY-1500", detail:"お会計から1,500円OFF"},
  {name:"2,000円OFF", code:"JY-2000", detail:"お会計から2,000円OFF"},
  {name:"300円OFF", code:"JY-300", detail:"お会計から300円OFF"},
  {name:"1,000円OFF", code:"JY-1000-B", detail:"お会計から1,000円OFF"},
  {name:"500円OFF", code:"JY-500-B", detail:"お会計から500円OFF"},
  {name:"2,000円OFF", code:"JY-2000-B", detail:"お会計から2,000円OFF"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const colors=[
  "#f7c9c9","#f8dfb5","#cde5d0","#cbdcf3",
  "#ead2ef","#f3e4b7","#d0e8e8","#e5d4c8"
];

const n=items.length;
const cx=400, cy=400, r=380;

function draw(){
  ctx.clearRect(0,0,800,800);

  for(let i=0;i<n;i++){
    const a0=i*2*Math.PI/n-Math.PI/2;
    const a1=(i+1)*2*Math.PI/n-Math.PI/2;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,a0,a1);
    ctx.closePath();

    ctx.fillStyle=colors[i];
    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=6;
    ctx.stroke();

    const a=(a0+a1)/2;

    ctx.save();
    ctx.translate(
      cx+Math.cos(a)*255,
      cy+Math.sin(a)*255
    );
    ctx.rotate(a+Math.PI/2);

    ctx.fillStyle="#333";
    ctx.font='900 24px "M PLUS Rounded 1c", sans-serif';
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(items[i].name,0,0);

    ctx.restore();
  }
}

document.fonts.ready.then(draw);

const HISTORY_KEY="shizuoka_johoku_roulette_history_v2";

const weights=[0,0,0,0,0,0,0,100];

let rotation=0;
let spinning=false;

function getWeightedIndex(){
  const totalWeight=weights.reduce(
    (sum,weight)=>sum+weight,0
  );

  let random=Math.random()*totalWeight;

  for(let i=0;i<weights.length;i++){
    random-=weights[i];
    if(random<0)return i;
  }

  return weights.length-1;
}

// 保存データを取得
function getSavedData(){
  try{
    const saved=localStorage.getItem(HISTORY_KEY);
    if(!saved)return null;

    const data=JSON.parse(saved);

    if(
      data &&
      Number.isInteger(data.index) &&
      data.index>=0 &&
      data.index<n
    ){
      return data;
    }
  }catch(e){}

  return null;
}

// 当選結果を表示
function showResult(index){
  document.getElementById("resultTitle").textContent=items[index].name;
  document.getElementById("coupon").textContent=items[index].code;
  document.getElementById("detail").textContent=items[index].detail;

  document.getElementById("result").style.display="block";
}

// 使用済み画面を表示
function showUsed(index){
  document.getElementById("wheel").style.display="none";
  document.querySelector(".wheelbox").style.display="none";
  document.getElementById("spin").style.display="none";
  document.getElementById("result").style.display="none";

  document.getElementById("usedPrice").textContent=items[index].name;
  document.getElementById("used").style.display="block";
}

// クーポン使用処理
document.getElementById("useCoupon").addEventListener("click",()=>{

  const data=getSavedData();

  if(!data || data.used===true)return;

  const confirmed=window.confirm(
    "クーポンを使用済みにしますか？\n\n一度使用済みにすると元に戻せません。"
  );

  if(!confirmed)return;

  data.used=true;
  data.usedAt=Date.now();

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(data)
  );

  showUsed(data.index);
});

// 前回の保存データを確認
const savedData=getSavedData();

if(savedData){

  if(savedData.used===true){
    showUsed(savedData.index);
  }else{
    document.querySelector(".wheelbox").style.display="none";
    document.getElementById("spin").style.display="none";
    showResult(savedData.index);
  }

}

// ルーレットを回す
document.getElementById("spin").addEventListener("click",()=>{

  if(spinning || getSavedData()!==null)return;

  spinning=true;
  document.getElementById("spin").disabled=true;

  const index=getWeightedIndex();

  // 当選結果を保存
  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify({
      index:index,
      savedAt:Date.now(),
      used:false
    })
  );

  const segment=360/n;
  const target=360*8+(360-(index+0.5)*segment);

  rotation+=target;

  canvas.style.transform=`rotate(${rotation}deg)`;

  // 8秒回転後、0.5秒待って結果表示
  setTimeout(()=>{
    showResult(index);
    spinning=false;
  },8500);

});
</script>

</body>
</html>
